/home/romanurmanov/work/E320/E320Prototype/E320Prototype_analysis/\
data/alignment/local_2026_data/cluster_error_test/sig/leave_one_out_errors/\
aligned/alignment-parameters.root\
"""

[Geometry]
# Use material decorator for the 
# material description
