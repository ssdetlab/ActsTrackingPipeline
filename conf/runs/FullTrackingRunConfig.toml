# WhiteBoard name of the output source links
outputSourceLinks = "SourceLinks"

# WhiteBoard name of the output cluster matrices
outputClusterMatrices = "ClusterMatrices"

# WhiteBoard name of the output detector source link indices
outputDetSourceLinkIndices = "DetSourceLinkIndices"

# WhiteBoard name of the output constraint source link indices
outputConstraintSourceLinkIndices = "ConstraintSourceLinkIndices"

# WhiteBoard name of the output event meta data
outputEventMetaData = "EventMetaData"

# Input tree name
treeName = "data"

# Tree event branch name
eventKey = "event"

# Read event of only specific EPICS parity
requireEpicsParity = false

# Required EPICS parity 
# Even = 0
# Odd = 1
requiredEpicsParity = 1

# Flag to select the measurement error model
# Uniform = 0
# Allpix2 = 1
measurementErrorModel = 1

# Cut on the maximum tracker occupancy
maxOccupancy = 1000

# Cut on the maximum cluster size
maxClusterSize = 4

# Propagation direction for extended source link
# invertion
backwards = true

[E320TrackParametersEstimator]
# Number of GX2 fit iterations
nIterations = 2

# Max GX2 chi2 cut
maxChi2 = 100000000
# maxChi2 = 100

# Propagation direction
# forward = 0
# backward = 1
propDirection = 0

[HoughTransformSeeder]
# The HT space is spanned by the slopes and the intercepts
# of the real space lines in the primary-long and the
# primary-short planes. The intercepts are taken at the
# primary position of the tracking chamber center. The
# ranges are half-open [min, max) and the pairs of
# measurements voting outside of them are discarded.
#
# Slope ranges cover the lines crossing all the chips
# (+-tcHalf / tcHalfPrimary); intercept ranges cover all the
# lines within the slope ranges passing through the tracking
# chamber (+-(tcHalf + maxSlope * tcHalfPrimary)) [mm]. The
# bin counts reproduce the cell sizes of the previous
# (theta, rho) binning with 500 x 500 cells; the odd slope
# bin counts center the zero slopes in a cell.

# Range and number of HT bins along the long slope axis
minSlopeLong = -0.374272
maxSlopeLong = 0.374272
nCellsSlopeLong = 119

# Range and number of HT bins along the long intercept axis
minInterceptLong = -29.94176
maxInterceptLong = 29.94176
nCellsInterceptLong = 175

# Range and number of HT bins along the short slope axis
minSlopeShort = -0.172032
maxSlopeShort = 0.172032
nCellsSlopeShort = 55

# Range and number of HT bins along the short intercept axis
minInterceptShort = -13.76256
maxInterceptShort = 13.76256
nCellsInterceptShort = 85

# Cut on the minimum number of intersections
# in a HT cell
minXCount = 5

[E320SeedingAlgorithm]
# WhiteBoard name of the input source links
inputSourceLinks = "SourceLinks"

# WhiteBoard name of the input detector source link indices
inputDetSourceLinkIndices = "DetSourceLinkIndices"

# WhiteBoard name of the input BPM source link indices
inputConstraintSourceLinkIndices = "ConstraintSourceLinkIndices"

# WhiteBoard name of the output seeds
outputSeeds = "Seeds"

# WhiteBoard name of the output track parameters
outputTrackParameters = "TrackParameters"

# Cut on the minimum number of tracking layers
# in a seed
minLayers = 5

# Cut on the maximum number of tracking layers
# in a seed
maxLayers = 5

[KFTrackFittingAlgorithm]
